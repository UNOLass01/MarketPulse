[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "marketpulse"
version = "0.1.0"
description = "Real-time crypto streaming analytics + ML pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pika>=1.3",
    "requests>=2.31",
    "pandas>=2.2",
    "numpy>=1.26",
    "lightgbm>=4.3",
    "scikit-learn>=1.4",
    # Pinned exactly, not >= : ml.registry relies on the model-registry
    # "stage" API (Staging/Production/Archived), which MLflow deprecated in
    # 2.9 in favor of aliases and may remove in a future major release. The
    # server image (docker/mlflow.Dockerfile) is pinned to the same version
    # deliberately -- bump both together and re-run tests/unit/test_ml_registry.py.
    "mlflow==3.15.1",
    "pyyaml>=6.0",
    # storage.archival: exports partitions to Parquet and uploads to the
    # MinIO/S3-compatible archive bucket -- see docs/plan/phase-4-airflow.md.
    "boto3>=1.34",
    "pyarrow>=16.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "black>=24.4",
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "pre-commit>=3.7",
    "testcontainers>=4.5",
    "types-requests>=2.31",
    "types-PyYAML>=6.0",
    "pandas-stubs>=2.2",
    "boto3-stubs[s3]>=1.34",
    # Only ever imported by tests/unit/test_dags.py (parses every DAG file --
    # phase-4 plan: "a broken DAG silently disables scheduling"). The actual
    # scheduler/webserver run in their own container (docker/airflow.Dockerfile),
    # pinned separately there -- keep the two versions in sync by hand.
    # 3.x, not 2.x: apache-airflow-core only added sqlalchemy>=2.0 support in
    # 3.3.0 (2.x and earlier 3.x are pinned to sqlalchemy<2.0, which directly
    # conflicts with this project's own sqlalchemy>=2.0 -- both marketpulse
    # and Airflow have to import cleanly in the same environment inside
    # docker/airflow.Dockerfile, not just here). See ADR 0003.
    "apache-airflow==3.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/marketpulse"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
packages = ["marketpulse"]
mypy_path = "src"
strict = true
disallow_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "pika.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "lightgbm.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "mlflow.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "sklearn.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "unit: fast, no I/O",
    "contract: schema/contract tests, no I/O",
    "integration: needs docker via testcontainers",
    "e2e: full loop through compose",
]

[tool.coverage.run]
source = ["src/marketpulse"]

[tool.coverage.report]
fail_under = 0
show_missing = true
