[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "marketpulse"
version = "0.1.0"
description = "Real-time crypto streaming analytics + ML pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pika>=1.3",
    "requests>=2.31",
    "pandas>=2.2",
    "numpy>=1.26",
    "lightgbm>=4.3",
    "scikit-learn>=1.4",
    # Pinned exactly, not >= : ml.registry relies on the model-registry
    # "stage" API (Staging/Production/Archived), which MLflow deprecated in
    # 2.9 in favor of aliases and may remove in a future major release. The
    # server image (docker/mlflow.Dockerfile) is pinned to the same version
    # deliberately -- bump both together and re-run tests/unit/test_ml_registry.py.
    "mlflow==3.15.1",
    "pyyaml>=6.0",
    # storage.archival: exports partitions to Parquet and uploads to the
    # MinIO/S3-compatible archive bucket -- see docs/plan/phase-4-airflow.md.
    "boto3>=1.34",
    "pyarrow>=16.0",
    # Phase 5 serving. Already pulled in transitively by mlflow, but declared
    # here because services/api imports them directly -- an inherited
    # dependency is not a dependency.
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # monitoring.drift's two-sample KS and chi-square tests. Same reasoning:
    # scikit-learn already drags scipy in, but drift.py imports it by name.
    "scipy>=1.11",
]

[project.optional-dependencies]
# Phase 6's read-only Streamlit dashboard. Separate from the core install so
# the producer/consumer/API images don't carry it -- only services/dashboard
# and the dev environment need it.
dashboard = ["streamlit>=1.36"]
dev = [
    # Linters and formatters are pinned exactly, unlike libraries: a new
    # ruff/black/mypy release changes what passes without a single line of
    # this repo changing, which turns a green CI red on an unrelated commit.
    # Bump these deliberately, in their own commit, with the fixes they
    # demand -- never let the resolver do it silently.
    "ruff==0.16.1",
    "black==26.5.1",
    "mypy==2.3.1",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "pre-commit>=3.7",
    "testcontainers>=4.5",
    # fastapi.testclient's transport -- importing TestClient without it
    # raises at import time, not at first use.
    "httpx>=0.27",
    "marketpulse[dashboard]",
    "types-requests>=2.31",
    "types-PyYAML>=6.0",
    "pandas-stubs>=2.2",
    "boto3-stubs[s3]>=1.34",
    # Only ever imported by tests/unit/test_dags.py (parses every DAG file --
    # phase-4 plan: "a broken DAG silently disables scheduling"). The actual
    # scheduler/webserver run in their own container (docker/airflow.Dockerfile),
    # pinned separately there -- keep the two versions in sync by hand.
    # 3.x, not 2.x: apache-airflow-core only added sqlalchemy>=2.0 support in
    # 3.3.0 (2.x and earlier 3.x are pinned to sqlalchemy<2.0, which directly
    # conflicts with this project's own sqlalchemy>=2.0 -- both marketpulse
    # and Airflow have to import cleanly in the same environment inside
    # docker/airflow.Dockerfile, not just here). See ADR 0003.
    "apache-airflow==3.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/marketpulse"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "services", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# B008 ("no function call in an argument default") is correct in general and
# wrong for FastAPI: `Depends(...)` / `Query(...)` in a default IS the
# framework's declaration syntax, evaluated once at import to build the
# dependency graph, not per call. Listing them here keeps B008 enforced
# everywhere it actually catches a shared-mutable-default bug.
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Depends",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Query",
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
# No `packages = [...]`: that would pin checking to marketpulse regardless of
# the arguments passed, so `mypy src services scripts` would silently skip
# the last two. Targets come from the Makefile's TYPE_PATHS instead.
mypy_path = "src"
explicit_package_bases = true
strict = true
disallow_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "pika.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "lightgbm.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "mlflow.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "sklearn.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "scipy.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "streamlit.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# --import-mode=importlib: tests/unit/test_pipeline.py and
# tests/integration/test_pipeline.py share a basename, and under the legacy
# "prepend" import mode two same-named test modules in __init__-less
# directories collide ("import file mismatch") the moment both tiers are
# collected in one run. That never happened while `make test` and
# `make test-int` were separate commands, so it sat latent until the
# coverage gate needed a single combined run. importlib mode gives each
# module a unique name from its full path -- the fix pytest recommends,
# without scattering __init__.py files through the test tree.
addopts = "-ra --import-mode=importlib"
markers = [
    "unit: fast, no I/O",
    "contract: schema/contract tests, no I/O",
    "integration: needs docker via testcontainers",
    "e2e: full loop through compose",
]

[tool.coverage.run]
source = ["src/marketpulse"]

[tool.coverage.report]
# Deliberately 0 here: the enforced floor is scoped to features/ and ml/ and
# lives in the Makefile's `test-ci` target as an explicit second `coverage
# report --include=... --fail-under=85` pass. A repo-wide number set here
# would be the blanket target CLAUDE.md explicitly rejects.
fail_under = 0
show_missing = true
