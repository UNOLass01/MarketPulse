name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check src tests
          black --check src tests

      - name: Typecheck
        run: mypy src

      - name: Unit + contract tests
        run: pytest tests/unit tests/contract --cov --cov-report=term-missing
